<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Console — redesign prototype (CR0)</title>
<!-- Throwaway layout prototype for PLAN CR0. Figures are illustrative: a toy 300-shopper model, not packages/gym. -->
<style>
@font-face { font-family: Satoshi; src: url('../apps/web/public/fonts/satoshi-variable.woff2') format('woff2'); font-weight: 300 900; font-display: swap; }
@font-face { font-family: Fredoka; src: url('../apps/web/public/fonts/fredoka-500.ttf') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: Fredoka; src: url('../apps/web/public/fonts/fredoka-600.ttf') format('truetype'); font-weight: 600; font-display: swap; }
:root {
  --teal: #004c4c; --teal-deep: #003a3a; --cream: #fdf3e3; --cream-2: #f6e8d0; --coral: #f3675a; --coral-ink: #9c2a1f;
  --sky: #ccffff; --bark: #2f1604; --bark-2: #5c503e; --sun: #f6d809; --amber: #e8d6b9; --trail: #a49885;
  --teal-ink: #00605c;
  --p1: #004c4c; --p2: #3a8f8a; --p3: #8a5a2b; --p4: #ff598b; --p5: #4d6a8f;
  font-family: Satoshi, system-ui, sans-serif; color: var(--bark); background: var(--teal);
  font-variant-numeric: tabular-nums; font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; line-height: 1.45; font-size: 15px; }
h1, h2, h3 { font-family: Fredoka, sans-serif; font-weight: 550; margin: 0; text-wrap: balance; }
h1 { font-size: 1.35rem; } h2 { font-size: 1.2rem; } h3 { font-size: .78rem; font-family: Satoshi, sans-serif; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--bark-2); }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 8px; min-height: 44px; padding: .6rem 1rem; font-weight: 700; background: var(--teal); color: var(--cream); transition: filter 150ms ease-out, transform 150ms ease-out; }
button:hover { filter: brightness(1.14); } button:active { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
button.quiet { background: transparent; color: var(--teal); box-shadow: inset 0 0 0 1.5px var(--teal); }
button.small { min-height: 32px; padding: .25rem .6rem; font-size: .78rem; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 6px; }
.topbar :focus-visible { outline-color: var(--sky); }
::selection { background: var(--sky); color: var(--teal); }
input, select { accent-color: var(--teal); caret-color: var(--teal); }
* { scrollbar-color: #53716b transparent; scrollbar-width: thin; }

.topbar { position: sticky; top: 0; z-index: 10; background: var(--teal); color: var(--cream); display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem max(24px, calc((100vw - 1360px) / 2 + 24px)); box-shadow: 0 6px 18px #002d2d40; }
.brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.sticker { display: grid; place-items: center; width: 38px; height: 38px; flex: none; border: 3px solid #fff; border-radius: 12px; transform: rotate(-6deg); background: var(--cream); color: var(--teal); }
.sticker svg { width: 22px; height: 22px; }
.source { display: flex; align-items: center; gap: .45rem; font-size: .82rem; color: var(--sky); white-space: nowrap; }
.source i { width: 8px; height: 8px; border-radius: 50%; background: #7dffb0; box-shadow: 0 0 0 3px #7dffb033; }
.top-actions { display: flex; align-items: center; gap: .8rem; }
.pill { border: 1px solid var(--sky); border-radius: 999px; padding: .35rem .75rem; font-weight: 700; font-size: .85rem; white-space: nowrap; }
.pill.paused, .pause { background: var(--coral); color: var(--bark); border-color: var(--coral); }
.pause { min-width: 104px; font-size: 1rem; }
.proto { background: var(--sky); color: var(--teal); text-align: center; font-size: .78rem; padding: .25rem .5rem; }

main { max-width: 1360px; margin: 0 auto; padding: 18px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.paper { background: var(--cream); border-radius: 14px; box-shadow: 0 8px 24px #002d2d33; }

/* Ledger: one band, real deals only */
.ledger { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)) auto; align-items: stretch; padding: 14px 22px; gap: 0; }
.ledger > * { padding: 2px 22px; border-left: 1px dashed var(--trail); display: grid; align-content: center; gap: 1px; }
.ledger > :first-child { border-left: 0; padding-left: 0; }
.ledger .lead b { font-family: Fredoka, sans-serif; font-weight: 550; font-size: 1.05rem; }
.ledger .lead span, .fig span, .ledger .aside span { font-size: .78rem; color: var(--bark-2); }
.fig b { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.9rem; line-height: 1.05; color: var(--teal); }
.fig.bump b { animation: bump 700ms cubic-bezier(.16, 1, .3, 1); }
@keyframes bump { 0% { transform: translateY(6px); filter: blur(3px); opacity: .3; } 100% { transform: none; filter: none; opacity: 1; } }
.ledger .aside b { font-size: 1.05rem; font-weight: 800; }
.pos { color: var(--teal-ink); } .neg { color: var(--coral-ink); }

.cols { display: grid; grid-template-columns: 318px minmax(0, 1fr) 348px; gap: 18px; align-items: start; }

/* Controls */
.controls { display: grid; grid-template-rows: 1fr auto; max-height: calc(100vh - 190px); min-height: 520px; overflow: hidden; }
.controls .scroll { overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px 6px; }
.group { padding: 14px 0; border-top: 1px dashed var(--trail); display: grid; gap: 12px; }
.group:first-of-type { border-top: 0; padding-top: 10px; }
.ctl { display: grid; gap: 3px; }
.ctl .row { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-weight: 700; font-size: .9rem; }
.ctl output { font-weight: 800; color: var(--teal); }
.ctl.changed output::after { content: " · not adopted"; font-weight: 600; font-size: .72rem; color: var(--bark-2); }
.ctl input[type=range] { width: 100%; height: 28px; margin: 0; }
.ctl small, .hint { font-size: .76rem; color: var(--bark-2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--teal); overflow: hidden; }
.seg label { text-align: center; padding: .5rem .2rem; font-size: .8rem; font-weight: 700; cursor: pointer; color: var(--teal); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--teal); color: var(--cream); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--teal); outline-offset: -3px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: .6rem; font-size: .88rem; font-weight: 700; }
.switch input { appearance: none; width: 40px; height: 24px; flex: none; border-radius: 999px; background: #cdbfa6; position: relative; cursor: pointer; transition: background 160ms ease-out; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform 160ms cubic-bezier(.16, 1, .3, 1); }
.switch input:checked { background: var(--teal); } .switch input:checked::after { transform: translateX(16px); }
.badge { display: flex; align-items: center; gap: .5rem; font-size: .82rem; font-weight: 700; color: var(--teal-ink); }
.badge svg { width: 18px; height: 18px; flex: none; }
.blocked-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .8rem; }
.blocked-list li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.products { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.products li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 6px 0; font-size: .84rem; }
.products .meta { grid-column: 1 / -1; font-size: .72rem; color: var(--bark-2); display: flex; gap: .4rem; flex-wrap: wrap; }
.tag { border-radius: 6px; padding: 0 .35rem; font-weight: 700; }
.tag.binds { background: var(--cream-2); } .tag.miss-cost { background: var(--coral); color: var(--bark); } .tag.miss-date { background: var(--amber); }
.adopt { padding: 12px 20px 16px; border-top: 1px dashed var(--trail); display: grid; gap: 6px; background: var(--cream); }
.adopt .btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.adopt p { font-size: .78rem; color: var(--bark-2); min-height: 1.1em; }

/* Forecast */
.forecast { padding: 18px 22px 20px; display: grid; gap: 14px; }
.fhead { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; }
.fhead p { font-size: .82rem; color: var(--bark-2); }
.fhead select { border: 1.5px solid var(--teal); border-radius: 8px; background: transparent; padding: .45rem .6rem; min-height: 40px; font-weight: 700; max-width: 100%; }
.stores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px dashed var(--trail); border-bottom: 1px dashed var(--trail); }
.store { padding: 12px 16px; border-left: 1px dashed var(--trail); display: grid; gap: 6px; align-content: start; }
.store:first-child { border-left: 0; padding-left: 0; }
.store.me { background: linear-gradient(#0000, #0000); }
.store h4 { margin: 0; font-size: .86rem; font-weight: 800; }
.store .sub { font-size: .74rem; color: var(--bark-2); margin-top: -4px; }
.metric { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px; font-size: .82rem; }
.metric .v { font-weight: 800; font-size: 1.02rem; text-align: right; white-space: nowrap; }
.store.me .metric .v { font-size: 1.22rem; font-family: Fredoka, sans-serif; font-weight: 600; color: var(--teal); }
.was { font-weight: 600; font-size: .78rem; color: var(--bark-2); text-decoration: line-through; text-decoration-thickness: 1px; margin-right: 4px; }
.delta { display: inline-block; font-size: .74rem; font-weight: 800; margin-left: 4px; }
.verdict { font-size: .95rem; font-weight: 700; }
.verdict b { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.1rem; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: Satoshi, sans-serif; font-size: 10.5px; fill: var(--bark-2); }
.chart .ref { stroke: var(--bark); stroke-width: 1; stroke-dasharray: 3 3; opacity: .55; }
.chart .reflabel { font-weight: 800; fill: var(--bark); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .76rem; color: var(--bark-2); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.legend .walk::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--trail); }

/* Right rail */
.rail { display: grid; gap: 18px; }
.needs { background: var(--sun); color: var(--bark); border-radius: 14px; box-shadow: 0 8px 24px #002d2d33; padding: 16px 18px; display: grid; gap: 8px; }
.needs h2 { font-size: 1.05rem; }
.needs .offer { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.7rem; line-height: 1; }
.needs .line { display: flex; justify-content: space-between; font-size: .86rem; gap: .5rem; }
.bar { height: 6px; border-radius: 999px; background: #2f160433; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bark); transform-origin: left; animation: drain 45s linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.needs .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.needs button { background: var(--bark); color: var(--cream); } .needs button.quiet { background: transparent; color: var(--bark); box-shadow: inset 0 0 0 1.5px var(--bark); }
.needs.done { background: var(--cream); } .needs.done .bar, .needs.done .btns { display: none; }
.feed { padding: 16px 18px 8px; }
.feed .fh { display: flex; justify-content: space-between; align-items: baseline; }
.feed .fh span { font-size: .78rem; color: var(--bark-2); }
.rows { max-height: 372px; overflow-y: auto; overscroll-behavior: contain; margin-top: 8px; }
.rows details { border-top: 1px dashed var(--trail); padding: 9px 0; font-size: .84rem; }
.rows details:first-child { border-top: 0; }
.rows summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
.rows summary::-webkit-details-marker { display: none; }
.rows summary b { font-weight: 800; }
.rows summary time { font-size: .72rem; color: var(--bark-2); }
.rows summary .what { grid-column: 1 / -1; color: var(--bark-2); }
.rows .more { margin-top: 8px; display: grid; gap: 6px; font-size: .78rem; color: var(--bark-2); }
.rows .more .acts { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.chip { border: 1px solid currentColor; border-radius: 999px; padding: 0 .45rem; font-size: .68rem; font-weight: 700; }
.rows details.blocked { background: #f3675a24; margin: 0 -10px; padding: 9px 10px; border-radius: 8px; border-top-color: transparent; }
.rows details.blocked summary b { color: var(--coral-ink); }
.rows details.blocked + details { border-top-color: transparent; }

@media (max-width: 1180px) {
  .cols { grid-template-columns: 300px minmax(0, 1fr); }
  .rail { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; align-items: start; }
  .ledger { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; }
  .ledger .lead, .ledger .aside { grid-column: 1 / -1; border-left: 0; padding-left: 0; }
  .ledger .lead + .fig { border-left: 0; padding-left: 0; }
}
@media (max-width: 760px) {
  main { padding: 12px 12px 32px; gap: 12px; }
  .topbar { padding: .6rem 12px; flex-wrap: wrap; } .brand { flex-wrap: wrap; } h1 { white-space: nowrap; } .source { order: 3; width: 100%; white-space: normal; } .console-label { display: none; }
  .cols, .rail { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .ledger { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 14px 16px; }
  .ledger .fig { padding: 2px 12px; } .ledger .fig:nth-of-type(odd) { }
  .ledger > .fig:nth-child(2), .ledger > .fig:nth-child(4) { border-left: 0; padding-left: 0; }
  .fig b { font-size: 1.55rem; }
  .controls { max-height: none; min-height: 0; } .controls .scroll { overflow: visible; }
  .adopt { position: sticky; bottom: 0; border-radius: 0 0 14px 14px; box-shadow: 0 -6px 14px #002d2d1f; }
  .stores { grid-template-columns: minmax(0, 1fr); } .store { border-left: 0; padding-left: 0; border-top: 1px dashed var(--trail); } .store:first-child { border-top: 0; }
  .forecast { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } .bar i { animation: none; } }

/* ---- prototype switcher (not part of the design) ---- */
.switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px #0008; font-size: .82rem; }
.switcher button { min-height: 34px; width: 34px; padding: 0; border-radius: 50%; background: #333; color: #fff; }
.switcher span { padding: 0 .8rem; font-weight: 700; white-space: nowrap; }
body { padding-bottom: 70px; }
.suggest { display: grid; gap: 4px; padding-bottom: 4px; }
.suggest p { font-size: .76rem; color: var(--bark-2); }

/* ---- Variant B: story first ---- */
.vB { display: grid; gap: 18px; }
.story { padding: 22px 26px; display: grid; gap: 16px; }
.story .top { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; }
.story h2 { font-size: 1.55rem; max-width: 30ch; }
.story h2 b { color: var(--teal); font-weight: 600; }
.lanes { display: grid; gap: 10px; }
.lane { display: grid; grid-template-columns: 150px minmax(0, 1fr) 96px; align-items: center; gap: 12px; font-size: .84rem; }
.lane .name { font-weight: 800; } .lane .name small { display: block; font-weight: 500; color: var(--bark-2); font-size: .72rem; }
.lane .track { display: flex; height: 30px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--trail); }
.lane.me .track { height: 46px; box-shadow: inset 0 0 0 2px var(--teal); }
.seg2 { display: grid; place-items: center; font-size: .74rem; font-weight: 800; white-space: nowrap; overflow: hidden; transition: flex-basis 320ms cubic-bezier(.16, 1, .3, 1); }
.seg2.full { background: var(--teal); color: var(--cream); } .seg2.saved { background: var(--sky); color: var(--teal); } .seg2.sale { background: #7fb8b3; color: var(--bark); } .seg2.gone { background: transparent; color: var(--bark-2); }
.lane .money { text-align: right; font-weight: 800; font-size: 1rem; } .lane.me .money { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.4rem; color: var(--teal); }
.tuner { padding: 16px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 8px 22px; align-items: end; }
.tuner .ctl small { display: none; }
.tuner .act { display: grid; gap: 6px; min-width: 190px; }
.vB .lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.mini { padding: 16px 20px; display: grid; gap: 10px; }
.mini .ledger2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.mini .ledger2 div b { display: block; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--teal); line-height: 1.1; }
.mini .ledger2 div span { font-size: .76rem; color: var(--bark-2); }
details.more-settings { border-top: 1px dashed var(--trail); padding-top: 10px; } details.more-settings summary { cursor: pointer; font-weight: 800; font-size: .86rem; }

/* ---- Variant C: live desk + receipt ---- */
.vC { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.vC .desk { display: grid; gap: 18px; }
.vC .rows { max-height: 300px; }
.receipt { padding: 20px 22px 22px; display: grid; gap: 4px; position: sticky; top: 84px; }
.receipt h2 { margin-bottom: 4px; }
.receipt .ln { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; padding: 5px 0; }
.receipt .ln.rule { border-top: 1px dashed var(--trail); margin-top: 4px; padding-top: 9px; }
.receipt .ln.total { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--teal); border-top: 2px solid var(--bark); margin-top: 6px; padding-top: 10px; }
.receipt .roi { font-size: .82rem; color: var(--bark-2); }
.receipt .roi b { color: var(--teal-ink); }
.vC .tune { padding: 0; } .vC .tune > summary { list-style: none; cursor: pointer; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; font-family: Fredoka, sans-serif; font-weight: 550; font-size: 1.2rem; }
.vC .tune > summary::-webkit-details-marker { display: none; } .vC .tune > summary span { font-family: Satoshi, sans-serif; font-size: .8rem; font-weight: 700; color: var(--teal); }
.vC .tune .inner { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0 22px; padding: 0 22px 20px; }
.vC .tune .controls { box-shadow: none; max-height: 560px; min-height: 0; } .vC .tune .controls .scroll { padding: 0 8px 0 0; } .vC .tune .forecast { box-shadow: none; padding: 0; }
@media (max-width: 1100px) { .vB .lower, .vC, .vC .tune .inner { grid-template-columns: minmax(0, 1fr); } .tuner { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .lane { grid-template-columns: 96px minmax(0, 1fr) 72px; } .receipt { position: static; } }

/* ---- Variant D: one setting in focus ---- */
.vD { display: grid; gap: 18px; }
.kept { display: flex; align-items: center; gap: 0; padding: 14px 24px; flex-wrap: wrap; }
.kept > div { padding: 2px 24px; border-left: 1px dashed var(--trail); display: grid; gap: 0; }
.kept > div:first-child { border-left: 0; padding-left: 0; }
.kept .hero b { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 2.3rem; line-height: 1; color: var(--teal); }
.kept .hero span { font-size: .8rem; color: var(--bark-2); }
.kept .k b { font-weight: 800; font-size: 1.15rem; } .kept .k span { font-size: .76rem; color: var(--bark-2); }
.kept .end { margin-left: auto; border-left: 0; }
.dcols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.slist { padding: 14px 12px 14px; display: grid; gap: 2px; }
.slist h2 { padding: 4px 10px 8px; }
.slist h3 { padding: 12px 10px 4px; }
.sitem { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; width: 100%; min-height: 42px; padding: .45rem .7rem; background: transparent; color: var(--bark); font-weight: 600; font-size: .92rem; text-align: left; border-radius: 8px; }
.sitem:hover { filter: none; background: var(--cream-2); }
.sitem b { font-weight: 800; color: var(--teal); white-space: nowrap; }
.sitem[aria-current=true] { background: var(--teal); color: var(--cream); } .sitem[aria-current=true] b { color: var(--sky); }
.sitem.changed::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 1.5px var(--bark); flex: none; align-self: center; margin-left: -2px; }
.slist .adopt { border-top: 1px dashed var(--trail); margin-top: 10px; padding: 12px 10px 2px; background: transparent; }
.focus { padding: 24px 28px 26px; display: grid; gap: 18px; min-height: 520px; align-content: start; }

<script>

const $ = s => document.querySelector(s), money = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-CA");
const LIST = 149, COST = 78, BANNER = LIST * 0.8;
const PERSONAS = [{ share: .25, lo: 80, hi: 125, open: .5, pat: 4 }, { share: .25, lo: 95, hi: 140, open: .72, pat: 3 }, { share: .2, lo: 120, hi: 175, open: .85, pat: 5 }, { share: .15, lo: 100, hi: 165, open: .8, pat: 1 }, { share: .15, lo: 135, hi: 190, open: .93, pat: 2 }];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shoppers = (() => { const r = rng(42), out = []; PERSONAS.forEach((p, i) => { for (let n = 0; n < Math.round(p.share * 300); n++) out.push({ persona: i, w: p.lo + r() * (p.hi - p.lo), open: p.open * (.85 + r() * .3), pat: Math.max(1, p.pat + (r() < .3 ? 1 : 0)) }); }); return out; })();

const live = { floor: 25, cap: 22, rounds: 4, lowball: 40, tone: "friendly" };
let draft = { ...live };
const minPrice = s => Math.max(Math.ceil(COST * (1 + s.floor / 100)), Math.ceil(LIST * (1 - s.cap / 100)));
function run(s) {
  const min = minPrice(s), paid = [], when = [], low = [];
  let none = 0, banner = 0, saved = 0, profit = 0, revenue = 0, missed = 0, lowballs = 0;
  for (const p of shoppers) {
    if (p.w >= LIST) none++; if (p.w >= BANNER) banner++;
    let price = null, round = 1; const isLow = p.w * p.open < LIST * s.lowball / 100;
    if (isLow) { lowballs++; if (p.w >= LIST) price = LIST; }
    else { const last = Math.min(s.rounds, p.pat + 1); round = last; for (let k = 1; k <= last; k++) { const ask = askAt(k, s, min); if (ask <= p.w) { price = ask; round = k; break; } } }
    paid.push(price); when.push(round); low.push(isLow);
    if (price === null) { if (p.w >= min) missed++; } else { profit += price - COST; revenue += price; if (p.w < LIST) saved++; }
  }
  const buyers = paid.filter(x => x !== null).length;
  return { min, paid, when, low, saved, missed, lowballs, avg: buyers ? revenue / buyers : 0, agent: { buyers, profit }, none: { buyers: none, profit: none * (LIST - COST) }, banner: { buyers: banner, profit: banner * (BANNER - COST) } };
}
const askAt = (k, s, min) => Math.ceil(LIST - Math.pow((k - 1) / (s.rounds - 1), .7) * (LIST - min));
const cell = (label, now, was, fmt, goodUp = true) => { const d = now - was, show = Math.round(d) !== 0; return `<div class="metric"><span>${label}</span><span class="v">${show ? `<span class="was">${fmt(was)}</span>` : ""}${fmt(now)}${show ? `<span class="delta ${(d > 0) === goodUp ? "pos" : "neg"}">${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d)).replace("−", "")}</span>` : ""}</span></div>`; };
const count = n => String(Math.round(n));

function chart(res, s) {
  const W = 640, H = 250, x0 = 112, x1 = 612, base = 216, TOP = 34, lo = COST - 4, hi = LIST + 4, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0), colors = ["--p1", "--p2", "--p3", "--p4", "--p5"];
  const floor = Math.ceil(COST * (1 + s.floor / 100)), bins = new Map(); let walked = 0, out = "";
  out += `<rect x="${X(COST)}" y="${TOP}" width="${Math.max(0, X(floor) - X(COST))}" height="${base - TOP}" fill="var(--amber)" opacity=".55"/>`;
  res.paid.forEach((price, i) => {
    if (price === null) { const c = walked++ % 11, r = Math.floor((walked - 1) / 11); out += `<circle cx="${4 + c * 8}" cy="${base - 5 - r * 8}" r="3" fill="none" stroke="var(--trail)" stroke-width="1.3"/>`; return; }
    const b = Math.round(price / 6) * 6, n = bins.get(b) || 0; bins.set(b, n + 1);
    const col = n % 4, row = Math.floor(n / 4);

  });

  out += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--trail)"/><text x="0" y="${base + 16}">${walked} walked away</text><text x="${x1}" y="${base + 16}" text-anchor="end">price paid →</text>`;
  root.querySelectorAll("[data-role=chart]").forEach(el => el.innerHTML = out);
}

// ---- comparison table: now vs if adopted, one row per figure, the focused setting's figures first ----
let allFigures = false;

      else if (b.paid[i] === null) { cx = 8 + (walkN % 6) * 8; cy = base - 5 - Math.floor(walkN / 6) * 8; walkN++; }

      <line x1="0" x2="612" y1="${base}" y2="${base}" stroke="var(--trail)"/><text x="${X(COST)}" y="${base + 14}" text-anchor="middle">cost $${COST}</text><text x="${X(floor)}" y="${base + 14}" text-anchor="middle">floor $${floor}</text><text x="${X(LIST)}" y="${base + 14}" text-anchor="middle">list $${LIST}</text><text x="0" y="${base + 14}">walked</text><text x="0" y="12">haggling</text></svg>`;

  el.innerHTML = `<div class="bar2"><h3>The 300 shoppers</h3><span class="pick" role="group" aria-label="Swarm picture (prototype choice)">${kinds.map(([k, l]) => `<button data-swarm="${k}" aria-pressed="${k === swarmKind}">${l}</button>`).join("")}</span>
    <span class="play"><button class="quiet small" data-act="play">${playTimer ? "Playing…" : "▶ Play the rounds"}</button><input type="range" min="0" max="${N}" value="${Math.min(upTo, N)}" data-scrub aria-label="Round"><span>${upTo >= N ? "all rounds" : upTo === 0 ? "arriving" : "round " + upTo}</span></span></div>${pic}

const keys = Object.keys(VARIANTS); let current = new URLSearchParams(location.search).get("variant"); if (!keys.includes(current)) current = "D";
