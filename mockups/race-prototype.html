<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price race — section prototype</title>
<!-- PROTOTYPE (throwaway). Question: does an animated price race, with one control under it, explain the simulation on its own?
     Toy model, illustrative figures. The real build uses packages/gym. -->
<style>
@font-face { font-family: Satoshi; src: url('../apps/web/public/fonts/satoshi-variable.woff2') format('woff2'); font-weight: 300 900; }
@font-face { font-family: Fredoka; src: url('../apps/web/public/fonts/fredoka-600.ttf') format('truetype'); font-weight: 600; }
:root { --teal: #004c4c; --cream: #fdf3e3; --cream-2: #f6e8d0; --coral-ink: #9c2a1f; --sky: #ccffff; --bark: #2f1604; --bark-2: #5c503e; --amber: #e8d6b9; --trail: #a49885; --saved: #19c3c3; --teal-ink: #00605c;
  font-family: Satoshi, system-ui, sans-serif; color: var(--bark); background: var(--teal); font-variant-numeric: tabular-nums; }
* { box-sizing: border-box; } body { margin: 0; padding: 28px 24px 60px; }
.paper { max-width: 1040px; margin: 0 auto; background: var(--cream); border-radius: 14px; box-shadow: 0 8px 24px #002d2d33; padding: 26px 30px 24px; display: grid; gap: 18px; }
h1 { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.5rem; margin: 0; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; }
.nums { display: flex; gap: 34px; }
.num b { display: block; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 2.4rem; line-height: 1; color: var(--teal); }
.num span { font-size: .82rem; color: var(--bark-2); } .num i { font-style: normal; font-weight: 800; font-size: .82rem; margin-left: 6px; }
.pos { color: var(--teal-ink); } .neg { color: var(--coral-ink); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: Satoshi, sans-serif; font-size: 12px; fill: var(--bark-2); }
.dot { transition: transform 760ms cubic-bezier(.22, 1, .36, 1), fill 300ms, stroke 300ms, opacity 300ms; }
.askline { transition: transform 700ms cubic-bezier(.22, 1, .36, 1); }
.asklabel { font-weight: 800; fill: var(--coral-ink); font-size: 13px; }
.strip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; border-top: 1px dashed var(--trail); padding-top: 18px; }
.pills { display: inline-flex; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--teal); overflow: hidden; }
button { font: inherit; cursor: pointer; border: 0; min-height: 44px; padding: .5rem 1rem; font-weight: 700; border-radius: 8px; background: var(--teal); color: var(--cream); }
.pills button { border-radius: 0; background: transparent; color: var(--teal); font-size: .88rem; } .pills button[aria-pressed=true] { background: var(--teal); color: var(--cream); }
button.quiet { background: transparent; color: var(--teal); box-shadow: inset 0 0 0 1.5px var(--teal); } button:disabled { opacity: .45; cursor: not-allowed; }
.slide { display: grid; gap: 2px; } .slide .row { display: flex; justify-content: space-between; font-weight: 700; font-size: .92rem; }
.slide output { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 1.3rem; color: var(--teal); line-height: 1; }
input[type=range] { width: 100%; height: 34px; margin: 0; accent-color: var(--teal); }
.why { grid-column: 1 / -1; font-size: .9rem; color: var(--bark-2); margin: 0; }
.key { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .8rem; color: var(--bark-2); }
.key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); box-shadow: inset 0 0 0 1.5px var(--b, transparent); }
.tip { min-height: 1.4em; font-size: .86rem; color: var(--bark-2); margin: 0; } .tip b { color: var(--bark); }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
@media (max-width: 760px) { .strip { grid-template-columns: minmax(0, 1fr); } .nums { gap: 20px; } .num b { font-size: 1.8rem; } }
@media (prefers-reduced-motion: reduce) { .dot, .askline { transition-duration: 1ms; } }
</style>
</head>
<body>
<section class="paper">
  <div class="head">
    <div><h1>Try it on 300 shoppers</h1><p class="tip" style="margin-top:4px">Trail Runner 2 · list $149 · simulated, never added to your real figures</p></div>
    <div class="nums">
      <div class="num"><b id="nSaved">0</b><span>customers saved<i id="dSaved"></i></span></div>
      <div class="num"><b id="nProfit">$0</b><span>profit<i id="dProfit"></i></span></div>
    </div>
  </div>
  <svg id="race" viewBox="0 0 980 380" role="img" aria-label="300 simulated shoppers. The asking price steps down each round and shoppers drop in at the price they pay."></svg>
  <div class="key"><span style="--c:var(--teal)">Paid list</span><span style="--c:var(--saved)">Saved by your shopkeeper</span><span style="--c:transparent;--b:var(--trail)">Walked away</span><span style="--c:var(--amber);--b:var(--bark-2)">Lowball, countered by code</span><span style="--c:#cdbfa6">Still deciding</span></div>
  <p class="tip" id="tip">Point at a shopper to see what happened to them.</p>
  <div class="strip">
    <span class="pills" role="group" aria-label="Setting" id="pills"></span>
    <label class="slide"><span class="row"><span id="sName"></span><output id="sVal"></output></span><input type="range" id="slider"></label>
    <span style="display:flex;gap:8px"><button class="quiet" id="play">▶ Play</button><button id="adopt" disabled>Adopt</button></span>
    <p class="why" id="why"></p>
  </div>
</section>
<script>
const LIST = 149, COST = 78, NS = "http://www.w3.org/2000/svg";
const PERSONAS = [{ share: .25, lo: 80, hi: 125, open: .5, pat: 4, n: "Bargain hunter" }, { share: .25, lo: 95, hi: 140, open: .72, pat: 3, n: "Budget runner" }, { share: .2, lo: 120, hi: 175, open: .85, pat: 5, n: "Gear nerd" }, { share: .15, lo: 100, hi: 165, open: .8, pat: 1, n: "Impatient" }, { share: .15, lo: 135, hi: 190, open: .93, pat: 2, n: "Loyal" }];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const r = rng(42), shoppers = [];
PERSONAS.forEach((p, i) => { for (let n = 0; n < Math.round(p.share * 300); n++) shoppers.push({ persona: i, w: p.lo + r() * (p.hi - p.lo), open: p.open * (.85 + r() * .3), pat: Math.max(1, p.pat + (r() < .3 ? 1 : 0)), jx: r(), jy: r(), delay: r() }); });

const SETTINGS = { floor: ["Floor", "Floor over cost", 0, 60, 1, v => `${v}% · $${Math.ceil(COST * (1 + v / 100))}`, "The lowest it may go on its own. Raise it and each sale earns more, but more shoppers walk."],
  cap: ["Max off", "Most it may take off list", 0, 40, 1, v => `${v}% · $${Math.ceil(LIST * (1 - v / 100))}`, "A ceiling on any discount. Whichever of floor and ceiling gives the higher price wins."],
  rounds: ["Rounds", "Rounds of haggling", 2, 6, 1, v => v, "How many offers before its final price. More rounds lets patient shoppers reach a lower price."],
  lowball: ["Lowball", "Lowball cutoff", 0, 80, 5, v => v ? `${v}% · $${Math.round(LIST * v / 100)}` : "off", "Offers under this get an instant counter written by code. No AI call, and the round doesn't count."] };
const live = { floor: 25, cap: 22, rounds: 4, lowball: 40 }; let draft = { ...live }, focus = "floor", upTo = 99, timer = null;
const minPrice = s => Math.max(Math.ceil(COST * (1 + s.floor / 100)), Math.ceil(LIST * (1 - s.cap / 100)));
const askAt = (k, s) => Math.ceil(LIST - Math.pow((k - 1) / (s.rounds - 1), .7) * (LIST - minPrice(s)));
function run(s) { return shoppers.map(p => { const low = p.w * p.open < LIST * s.lowball / 100; if (low) return { low, round: 1, paid: p.w >= LIST ? LIST : null };
  const last = Math.min(s.rounds, p.pat + 1); for (let k = 1; k <= last; k++) if (askAt(k, s) <= p.w) return { low, round: k, paid: askAt(k, s) }; return { low, round: last, paid: null }; }); }
const totals = (res, upto) => res.reduce((t, o, i) => { if (o.paid !== null && o.round <= upto) { t.profit += o.paid - COST; if (shoppers[i].w < LIST) t.saved++; } return t; }, { saved: 0, profit: 0 });

// stage
const svg = document.getElementById("race"), W = 980, X0 = 70, X1 = 950, CLOUD = [44, 150], BASE = 336, lo = COST - 6, hi = 196;
const X = v => X0 + (Math.min(v, hi) - lo) / (hi - lo) * (X1 - X0);
const el = (n, a, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t) e.textContent = t; svg.appendChild(e); return e; };
const band = el("rect", { y: CLOUD[0] - 14, height: BASE - CLOUD[0] + 14, fill: "var(--amber)", opacity: .5 });
el("line", { x1: 0, x2: W, y1: BASE, y2: BASE, stroke: "var(--trail)" });
el("text", { x: 0, y: 18 }, "what each shopper would pay →"); el("text", { x: 0, y: BASE + 34 }, "price they paid →");
const tCost = el("text", { y: BASE + 18, "text-anchor": "middle" }), tFloor = el("text", { y: BASE + 18, "text-anchor": "middle" }), tList = el("text", { y: BASE + 18, "text-anchor": "middle" });
const dots = shoppers.map((p, i) => { const c = el("circle", { class: "dot", r: 4.2, "data-i": i }); c.style.transitionDelay = Math.round(p.delay * 260) + "ms"; return c; });
const ask = document.createElementNS(NS, "g"); ask.setAttribute("class", "askline"); svg.appendChild(ask);
ask.innerHTML = `<line y1="${CLOUD[0] - 22}" y2="${BASE}" stroke="var(--coral-ink)" stroke-width="2.5"/><text class="asklabel" y="${CLOUD[0] - 28}" text-anchor="middle"></text>`;

function paint() {
  const s = draft, res = run(s), N = s.rounds, k = Math.min(upTo, N), floor = Math.ceil(COST * (1 + s.floor / 100)), stacks = new Map();
  band.setAttribute("x", X(COST)); band.setAttribute("width", Math.max(0, X(floor) - X(COST)));
  [[tCost, COST, "cost"], [tFloor, floor, "floor"], [tList, LIST, "list"]].forEach(([t, v, l]) => { t.setAttribute("x", X(v)); t.textContent = `${l} $${v}`; });
  const price = askAt(Math.max(1, k), s); ask.style.transform = `translateX(${X(k === 0 ? LIST : price)}px)`; ask.querySelector("text").textContent = k === 0 ? "asking $149" : `round ${Math.min(k, N)} · asking $${price}`;
  shoppers.forEach((p, i) => { const o = res[i], d = dots[i], decided = o.round <= k; let x = X(p.w) + (p.jx - .5) * 10, y = CLOUD[0] + p.jy * (CLOUD[1] - CLOUD[0]), fill = "#cdbfa6", stroke = "none";
    if (o.low && o.paid === null) { fill = "var(--amber)"; stroke = "var(--bark-2)"; }
    else if (decided && o.paid !== null) { const n = stacks.get(o.paid) || 0; stacks.set(o.paid, n + 1); x = X(o.paid) - 22 + (n % 6) * 9; y = BASE - 6 - Math.floor(n / 6) * 9; fill = p.w >= LIST ? "var(--teal)" : "var(--saved)"; }
    else if (decided) { fill = "transparent"; stroke = "var(--trail)"; }
    d.style.transform = `translate(${x}px, ${y}px)`; d.setAttribute("fill", fill); d.setAttribute("stroke", stroke); d.setAttribute("stroke-width", 1.5); });
  const now = totals(res, k), was = totals(run(live), 99), done = k >= N;
  document.getElementById("nSaved").textContent = now.saved; document.getElementById("nProfit").textContent = "$" + now.profit.toLocaleString("en-CA");
  const delta = (id, d, fmt) => { const e = document.getElementById(id); e.textContent = done && d ? `${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d))}` : ""; e.className = d > 0 ? "pos" : "neg"; };
  delta("dSaved", now.saved - was.saved, String); delta("dProfit", now.profit - was.profit, v => "$" + v.toLocaleString("en-CA"));
  const [, name, mn, mx, st, fmt, why] = SETTINGS[focus], sl = document.getElementById("slider");
  Object.assign(sl, { min: mn, max: mx, step: st, value: s[focus] }); document.getElementById("sName").textContent = name; document.getElementById("sVal").textContent = fmt(s[focus]); document.getElementById("why").textContent = why;
  document.getElementById("pills").innerHTML = Object.entries(SETTINGS).map(([key, v]) => `<button data-k="${key}" aria-pressed="${key === focus}">${v[0]}${draft[key] !== live[key] ? " •" : ""}</button>`).join("");
  document.getElementById("adopt").disabled = JSON.stringify(live) === JSON.stringify(draft);
}
function play() { clearInterval(timer); upTo = 0; paint(); timer = setInterval(() => { upTo++; if (upTo >= draft.rounds) { clearInterval(timer); timer = null; upTo = 99; } paint(); }, 1050); }
let settle; document.getElementById("slider").oninput = e => { draft[focus] = +e.target.value; clearInterval(timer); upTo = 99; paint(); clearTimeout(settle); };
document.getElementById("slider").onchange = () => { settle = setTimeout(play, 250); };      // never animates while dragging; replays once on release
document.getElementById("pills").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { focus = b.dataset.k; paint(); } };
document.getElementById("play").onclick = play;
document.getElementById("adopt").onclick = () => { Object.assign(live, draft); paint(); document.getElementById("why").textContent = "Adopted. Your shopkeeper uses this from the next shopper message."; };
svg.addEventListener("mouseover", e => { const c = e.target.closest("[data-i]"); if (!c) return; const i = +c.dataset.i, p = shoppers[i], o = run(draft)[i];
  document.getElementById("tip").innerHTML = `<b>${PERSONAS[p.persona].n}</b> · would pay up to <b>$${Math.round(p.w)}</b> · opened at $${Math.round(p.w * p.open)} · ${o.low ? "lowball: countered by code, no AI call" : o.paid === null ? `walked after round ${o.round}${p.w >= minPrice(draft) ? " — a deal missed" : ""}` : `bought at <b>$${o.paid}</b> in round ${o.round}${p.w < LIST ? " — a customer saved" : ""}`}`; });
paint(); setTimeout(play, 500);
</script>
</body>
</html>
